name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
            artifact-name: msdf-atlas-studio-linux-x86_64
            artifact-path: |
              bin/libmsdf_backend.linux.*.x86_64.so
            run-smoke-test: true

          - name: Windows (x86_64)
            os: windows-latest
            platform: windows
            arch: x86_64
            artifact-name: msdf-atlas-studio-windows-x86_64
            artifact-path: |
              bin/libmsdf_backend.windows.*.x86_64.dll
            run-smoke-test: false

          - name: macOS (Universal)
            os: macos-latest
            platform: macos
            arch: universal
            artifact-name: msdf-atlas-studio-macos-universal
            artifact-path: |
              bin/libmsdf_backend.macos.*.universal.dylib
            run-smoke-test: false

    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
      SCONS_CACHE_LIMIT: 4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons

      - name: Setup Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y build-essential pkg-config libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev

      - name: Setup MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup SCons build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons-cache/
          key: scons-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('src_cpp/**', '.gitmodules') }}
          restore-keys: |
            scons-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Build GDExtension (template_release)
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            docker run --rm \
              -v ${{ github.workspace }}:/workspace \
              -v ${{ github.workspace }}/.scons-cache:/workspace/.scons-cache \
              -e SCONS_CACHE=/workspace/.scons-cache/ \
              -e SCONS_CACHE_LIMIT=4096 \
              -w /workspace/src_cpp \
              ubuntu:20.04 bash -c "
                apt-get update -qq && \
                DEBIAN_FRONTEND=noninteractive apt-get install -qq -y build-essential python3 python3-pip && \
                python3 -m pip install --quiet scons && \
                CORES=\$(nproc 2>/dev/null || echo 2) && \
                scons platform=linux arch=x86_64 target=template_release -j\${CORES} && \
                chmod -R a+rw /workspace/bin /workspace/.scons-cache /workspace/src_cpp
              "
          else
            cd src_cpp
            CORES=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
            scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_release -j${CORES}
          fi

      - name: Setup Godot for Smoke Test
        if: matrix.run-smoke-test
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          mv Godot_v4.3-stable_linux.x86_64 godot

      - name: Run Headless Verification Smoke Test
        if: matrix.run-smoke-test
        run: |
          ./godot --headless --quit --path .

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Export Standalone Apps & Publish Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_draft_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Organize compiled GDExtension binaries
        run: |
          mkdir -p bin
          find downloaded-artifacts -type f \( -name "*.so" -o -name "*.dll" -o -name "*.dylib" \) -exec cp {} bin/ \;
          cp bin/libmsdf_backend.linux.template_release.x86_64.so bin/libmsdf_backend.linux.template_debug.x86_64.so 2>/dev/null || true
          cp bin/libmsdf_backend.windows.template_release.x86_64.dll bin/libmsdf_backend.windows.template_debug.x86_64.dll 2>/dev/null || true
          cp bin/libmsdf_backend.macos.template_release.universal.dylib bin/libmsdf_backend.macos.template_debug.universal.dylib 2>/dev/null || true
          ls -la bin/

      - name: Setup Godot and Export Templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          mv Godot_v4.3-stable_linux.x86_64 godot

          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Export Standalone Desktop Applications
        run: |
          TAG_OR_REF="${{ github.ref_name }}"
          if [ -z "$TAG_OR_REF" ] || [ "$TAG_OR_REF" = "main" ]; then
            TAG_OR_REF="latest"
          fi

          mkdir -p build/linux build/windows build/macos
          touch build/.gdignore

          ./godot --headless --export-release "Linux" build/linux/msdf-atlas-studio.x86_64
          mkdir -p build/linux/assets
          cp -r assets/fonts build/linux/assets/
          cp icon.svg LICENSE README.md CONTRIBUTORS.md build/linux/
          tar -czf "msdf-atlas-studio-${TAG_OR_REF}-linux-x86_64.tar.gz" -C build/linux .

          ./godot --headless --export-release "Windows" build/windows/msdf-atlas-studio.exe
          mkdir -p build/windows/assets
          cp -r assets/fonts build/windows/assets/
          cp icon.svg LICENSE README.md CONTRIBUTORS.md build/windows/
          (cd build/windows && zip -r "../../msdf-atlas-studio-${TAG_OR_REF}-windows-x86_64.zip" .)

          ./godot --headless --export-release "macOS" build/macos/msdf-atlas-studio.zip
          unzip -q build/macos/msdf-atlas-studio.zip -d build/macos/extracted
          mkdir -p "build/macos/extracted/msdf-atlas-studio.app/Contents/MacOS/bin"
          cp bin/msdf_atlas_studio.gdextension "build/macos/extracted/msdf-atlas-studio.app/Contents/MacOS/bin/"
          cp bin/libmsdf_backend.macos.template_release.universal.dylib "build/macos/extracted/msdf-atlas-studio.app/Contents/MacOS/bin/"
          mkdir -p "build/macos/extracted/assets"
          cp -r assets/fonts "build/macos/extracted/assets/"
          cp icon.svg LICENSE README.md CONTRIBUTORS.md build/macos/extracted/
          (cd build/macos/extracted && zip -r "../../../msdf-atlas-studio-${TAG_OR_REF}-macos-universal.zip" .)

          zip -r "msdf-atlas-studio-${TAG_OR_REF}-gdextension.zip" bin/ LICENSE CONTRIBUTORS.md README.md

          ls -lh *.zip *.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            msdf-atlas-studio-*-linux-x86_64.tar.gz
            msdf-atlas-studio-*-windows-x86_64.zip
            msdf-atlas-studio-*-macos-universal.zip
            msdf-atlas-studio-*-gdextension.zip
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.create_draft_release }}
          prerelease: false
          generate_release_notes: true
